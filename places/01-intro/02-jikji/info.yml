name: 직지심체요절
comment: |
  1377년 청주 흥덕사에서 금속활자로 찍어 낸 책으로,
  현존하는 세계에서 가장 오래된 금속활자본이에요.
  구텐베르크 성경보다 78년이나 앞서요.

  2001년 유네스코 세계기록유산에 등재됐고,
  원본(하권)은 지금 프랑스 국립도서관에 있어요.
  흥덕사 터에는 청주고인쇄박물관이 있어요.
tags: [세계 최고(最古) 금속활자본, 유네스코 세계기록유산]
