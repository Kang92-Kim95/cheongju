name: 청주는 어떤 곳?
comment: |
  (샘플) 저희가 만나고 함께 지낸 도시, 청주를 소개해요.
  여기에 청주 이야기나 저희 추억을 적어 주세요.
credits:   # 사진 출처 (순서대로). 공개 라이선스 사진이라 출처 표시가 필요해요
