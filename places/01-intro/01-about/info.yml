name: 청주는 어떤 곳?
caption: 경부고속도로 청주IC로 들어오면 만날 수 있는 플라타너스 가로수길   # 사진 바로 아래 한 줄 설명
comment: |
  충청북도 도청이 있는 충북 최대 도시예요.
  2014년 청원군과 합쳐져 인구 약 85만의 도시가 되었어요.

  도심을 가로지르는 무심천은 봄이면 벚꽃길이 되고,
  시내로 들어오는 가로수길은 플라타너스 터널로 유명해요.
  예부터 '교육의 도시'로도 불렸고,
  KTX 오송역과 청주국제공항이 있어 오가기도 편해요.
tags: [충북 도청 소재지, 무심천 벚꽃, 가로수길]
