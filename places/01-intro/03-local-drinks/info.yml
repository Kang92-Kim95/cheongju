name: 청주의 술
comment: |
  청주에서 한잔하신다면 지역 술을 드셔 보세요 🍶

  시원소주
  정식 이름은 '시원한 청풍'. 병에 '충북인의 대표소주'라고 적혀 있을 만큼
  충북에서 많이 마시는 소주예요. 청주 식당에서 초록병 옆에 꼭 있어요.

  가덕막걸리
  청주 가덕면에서 빚는 막걸리예요.
  '가덕'이 붙은 막걸리가 여러 가지라 가게마다 라벨이 다를 수 있어요.
  (예: 청주 참가덕)

  덕산막걸리
  충북 진천 덕산에서 빚는 막걸리도 청주에서 자주 볼 수 있어요.
tags: [시원소주, 가덕막걸리, 덕산막걸리]
