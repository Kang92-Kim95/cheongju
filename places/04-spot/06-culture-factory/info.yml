name: 문화제조창 (옛 연초제조창)
area: 청원구 내덕동
comment: |
  1946년 문을 연 담배 공장이 문화 공간으로 다시 태어났어요.
  2019년 시민 투표로 '문화제조창'이라는 새 이름을 얻었어요.
  청주공예비엔날레가 열리는 곳이고,
  바로 옆 국립현대미술관 청주와 한 번에 둘러볼 수 있어요.
