  comment: |
    청주 오시면 삼겹살에 간장 소스는 꼭 드셔보세요.
    저희 단골집이에요.
  menu: 생삼겹, 된장찌개
  tags: [웨이팅 있음, 단체석]
  photos: [sample-soju/1.svg, sample-soju/2.svg]

