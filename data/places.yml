# ─────────────────────────────────────────────────────────────
# 장소 목록. 한 곳 추가 = 아래 블록 하나 복사해서 붙이기
#
#   name      (필수) 가게 이름
#   category  (필수) categories.yml 의 id (cafe, bap, soju, beer, bread, spot)
#   comment   (필수) 우리 한마디. 여러 줄은 "|" 다음 줄부터 들여쓰기
#   photos    (선택) images/places/ 아래 경로. 적은 순서대로 옆으로 넘겨짐
#   kakao     (선택) 카카오맵 앱 > 공유 > 링크 복사. 없으면 이름으로 검색 링크가 자동 생성
#   area      (선택) 동네 (예: 성안길)
#   distance  (선택) 예: 예식장에서 차로 10분
#   menu      (선택) 추천 메뉴
#   tags      (선택) [주차 가능, 웨이팅 있음]
#
# ⚠️ 아래 "샘플" 가게들은 화면 확인용이에요. 실제 가게로 바꿔 주세요.
# ─────────────────────────────────────────────────────────────

- name: 샘플 카페
  category: cafe
  area: 성안길
  distance: 예식장에서 차로 10분
  comment: |
    둘이 처음 데이트한 카페예요.
    창가 자리에 앉으면 햇살이 정말 예뻐요.
  menu: 아인슈페너, 바스크 치즈케이크
  tags: [주차 가능, 창가 자리]
  photos: [sample-cafe/1.svg, sample-cafe/2.svg, sample-cafe/3.svg]

